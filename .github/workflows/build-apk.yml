name: Build APK

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  - name: Create Android project
    run: |
      rm -rf app
      rm -f build.gradle settings.gradle gradle.properties

      mkdir -p app/src/main/java/com/ketrika/v56

      cat > settings.gradle <<'EOF'
      pluginManagement {
          repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
          }
      }

      dependencyResolutionManagement {
          repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
          repositories {
              google()
              mavenCentral()
          }
      }

      rootProject.name = "Ketrika-v56"
      include(":app")
      EOF

      cat > gradle.properties <<'EOF'
      android.useAndroidX=true
      android.nonTransitiveRClass=true
      EOF

      cat > app/build.gradle <<'EOF'
      plugins {
          id 'com.android.application'
      }

      android {
          namespace 'com.ketrika.v56'
          compileSdk 34

          defaultConfig {
              applicationId 'com.ketrika.v56'
              minSdk 21
              targetSdk 34
              versionCode 56
              versionName '56.0'
          }

          compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
          }
      }

      dependencies {
          implementation 'androidx.appcompat:appcompat:1.6.1'
      }
      EOF

      cat > app/src/main/AndroidManifest.xml <<'EOF'
      <?xml version="1.0" encoding="utf-8"?>
      <manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <application
              android:allowBackup="true"
              android:label="Ketrika v56"
              android:supportsRtl="true">

              <activity
                  android:name=".MainActivity"
                  android:exported="true">

                  <intent-filter>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent-filter>

              </activity>

          </application>

      </manifest>
      EOF

      cat > app/src/main/java/com/ketrika/v56/MainActivity.java <<'EOF'
      package com.ketrika.v56;

      import android.os.Bundle;
      import androidx.appcompat.app.AppCompatActivity;

      public class MainActivity extends AppCompatActivity {

          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
          }
      }
      EOF

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v3
    with:
      gradle-version: '8.5'
      cache-disabled: true

  - name: Build APK
    run: |
      gradle :app:assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Ketrika-v56-APK
      path: app/build/outputs/apk/debug/app-debug.apk
