name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Fix Project
        run: |
          rm -rf app/src/main/Androidmanifest.xml app/build.gradle
          rm -f app/src/main/java/com/ketrika/v56/MainActivity.kt
          mkdir -p app/src/main/java/com/ketrika/v56
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "" > build.gradle
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.ketrika.v56'" >> app/build.gradle
          echo " compileSdk 34" >> app/build.gradle
          echo " defaultConfig { applicationId 'com.ketrika.v56'" >> app/build.gradle
          echo " minSdk 21" >> app/build.gradle
          echo " targetSdk 34" >> app/build.gradle
          echo " versionCode 56" >> app/build.gradle
          echo " versionName '56.0' } }" >> app/build.gradle
          echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }" >> app/build.gradle
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' >> app/src/main/AndroidManifest.xml
          echo '<application android:label="Ketrika v56">' >> app/src/main/AndroidManifest.xml
          echo '<activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Light">' >> app/src/main/AndroidManifest.xml
          echo '<intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '</activity></application></manifest>' >> app/src/main/AndroidManifest.xml
          echo 'package com.ketrika.v56;' > app/src/main/java/com/ketrika/v56/MainActivity.java
          echo 'import android.app.Activity;' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo 'import android.os.Bundle;' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo 'import android.widget.TextView;' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo 'import android.view.Gravity;' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo 'public class MainActivity extends Activity {' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' @Override protected void onCreate(Bundle b){' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' super.onCreate(b);' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' TextView tv=new TextView(this);' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' tv.setText("KETRIKA v56 - MAITSO SUCCESS");' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' tv.setTextSize(28);' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' tv.setGravity(Gravity.CENTER);' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' setContentView(tv);' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo ' }' >> app/src/main/java/com/ketrika/v56/MainActivity.java
          echo '}' >> app/src/main/java/com/ketrika/v56/MainActivity.java
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Build
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Ketrika-v56-APK
          path: app/build/outputs/apk/debug/*.apk
