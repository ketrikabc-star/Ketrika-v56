name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Fix
        run: |
          rm -rf app/src/main/Androidmanifest.xml app/src/main/AndroidManifest.xml
          rm -f app/src/main/java/com/ketrika/v56/MainActivity.kt
          rm -f app/build.gradle build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/ketrika/v56
          echo "include:app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'ENDOFFILE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ketrika.v56'
            compileSdk 34
            defaultConfig {
              applicationId "com.ketrika.v56"
              minSdk 21
              targetSdk 34
              versionCode 56
              versionName "56.0"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          ENDOFFILE
          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Ketrika v56">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ENDOFFILE
          cat > app/src/main/java/com/ketrika/v56/MainActivity.java <<'ENDOFFILE'
          package com.ketrika.v56;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle b){ super.onCreate(b); }
          }
          ENDOFFILE
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true
      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ketrika-v56-APK
          path: app/build/outputs/apk/debug/*.apk
