name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Fix Project
        run: |
          rm -f app/src/main/Androidmanifest.xml app/src/main/java/com/ketrika/v56/MainActivity.kt
          mkdir -p app/src/main/java/com/ketrika/v56
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          echo "" > build.gradle
          printf "plugins { id 'com.android.application' }\nandroid {\n namespace 'com.ketrika.v56'\n compileSdk 34\n defaultConfig { applicationId \"com.ketrika.v56\"\n minSdk 21\n targetSdk 34\n versionCode 56\n versionName \"56.0\" }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17 } }\ndependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }\n" > app/build.gradle
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n<application android:label=\"Ketrika v56\">\n<activity android:name=\".MainActivity\" android:exported=\"true\">\n<intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter>\n</activity>\n</application>\n</manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package com.ketrika.v56;\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\npublic class MainActivity extends AppCompatActivity { @Override protected void onCreate(Bundle b){super.onCreate(b);} }\n" > app/src/main/java/com/ketrika/v56/MainActivity.java
      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ketrika-v56-APK
          path: app/build/outputs/apk/debug/*.apk
