<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KETRIKA V56</title><style>body{background:#0a0a0a;color:#ffd700;font-family:sans-serif;padding:12px}h1{text-align:center;color:#ff1744}.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;margin:10px 0}button{background:#ff1744;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin:6px 0}input{width:100%;padding:10px;border-radius:8px;background:#222;color:#fff;border:1px solid #333}.num{display:inline-block;width:38px;height:38px;line-height:38px;text-align:center;border-radius:50%;background:#222;border:1px solid gold;margin:3px}.hit{background:#ff1744;color:#fff}</style></head><body><h1>KETRIKA V56</h1><div class="card"><input id="t" placeholder="Ex: 12-45-7-89-33"><button onclick="a()">ANALYSE V56</button><div id="r"></div></div><div class="card"><div id="p" style="text-align:center"></div><button onclick="g()">PREDICTION VAOVAO</button></div><script>let H=[];function a(){let v=document.getElementById('t').value;let n=v.split(/[-, ]+/).map(x=>+x).filter(x=>x>=1&&x<=90);if(n.length!=5)return alert('5 isa!');H.unshift(n);document.getElementById('r').innerHTML=n.map(x=>`<span class=num hit>${x}</span>`).join('');g()}function g(){let f={};for(let i=1;i<=90;i++)f[i]=0;H.forEach(a=>a.forEach(x=>f[x]++));let s=Object.keys(f).map(k=>({n:+k,c:f[k]})).sort((a,b)=>b.c-a.c);let t=s.slice(0,12).map(o=>o.n);while(t.length<5){let r=Math.floor(Math.random()*90)+1;if(!t.includes(r))t.push(r)}let p=t.sort(()=>.5-Math.random()).slice(0,5).sort((a,b)=>a-b);document.getElementById('p').innerHTML=p.map(x=>`<span class=num hit>${x}</span>`).join('')}g()</script></body></html>
